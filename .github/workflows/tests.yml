
name: Project Atlas Tests

on:
  push:
    branches:
      - main
      - feature/docker-ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository kodunu indir
        uses: actions/checkout@v4

      - name: Python ortamini kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Python testlerini calistir
        run: python -m pytest -v

      - name: Docker imajini olustur
        run: docker build -t project-atlas:ci .

      - name: Docker icinde testleri calistir
        run: docker run --rm project-atlas:ci python -m pytest -v
